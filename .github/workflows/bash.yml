name: Bash

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint Bash scripts
        shell: bash
        run: |
          shopt -s globstar nullglob
          shellcheck **/*.sh --severity error